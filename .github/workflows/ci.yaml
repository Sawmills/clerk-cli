name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build
        run: cargo build --release

  trunk:
    permissions:
      contents: read
      checks: write
    name: Trunk Code Quality
    # trunk-ignore(actionlint/runner-label): Namespace profile
    runs-on: namespace-profile-sawmills-runner-large
    timeout-minutes: 15
    concurrency:
      group: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}-trunk
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch Trunk baseline
        id: baseline
        timeout-minutes: 2
        env:
          TRUNK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          base="$TRUNK_BASE_SHA"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            base="$(git rev-parse HEAD^1)"
          fi
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]]; then
            echo "::error::Trunk Check requires a valid baseline commit."
            exit 1
          fi
          history=()
          if [[ "$(git rev-parse --is-shallow-repository)" == true ]]; then
            history=(--unshallow)
          fi
          git fetch --no-tags --no-recurse-submodules "${history[@]}" origin "$base" "$GITHUB_SHA"
          echo "base=$base" >> "$GITHUB_OUTPUT"


      - name: Cache Trunk and Rust artifacts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        # yamllint disable-line rule:line-length
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0
        with:
          cache: rust
          path: |
            /home/runner/.cache/trunk
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Trunk
        timeout-minutes: 2
        uses: trunk-io/trunk-action/setup@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1

      - name: Trunk Check
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUNK_BASE_SHA: ${{ steps.baseline.outputs.base }}
          TRUNK_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          TRUNK_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          annotations=(--github-annotate)
          if [[ "$TRUNK_FORK" == true ]]; then
            annotations=("--github-annotate-file=$RUNNER_TEMP/annotations.bin")
          fi
          if timeout --kill-after=5s 590s "$TRUNK_PATH" check --ci \
            --upstream "$TRUNK_BASE_SHA" --github-commit "$TRUNK_HEAD_SHA" \
            "${annotations[@]}"; then
            exit 0
          else
            status=$?
            if [[ "$status" == 124 || "$status" == 137 ]]; then
              echo "::error::Trunk Check exceeded its 10-minute limit; the check process was terminated."
            fi
            exit "$status"
          fi

      - name: Save fork annotations
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trunk-annotations
          overwrite: true
          path: ${{ runner.temp }}/annotations.bin

      - name: Trunk failure diagnostics
        if: failure()
        shell: bash
        run: |
          for log in .trunk/logs/cli.log .trunk/logs/daemon.log; do
            if [[ -f "$log" ]]; then
              echo "::group::$log (last 200 lines)"
              tail -n 200 "$log"
              echo "::endgroup::"
            fi
          done

  conventional_commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v6
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
